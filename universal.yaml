# Universal GVP — Organization-Wide Values, Principles, Heuristics, Rules
#
# Highest-priority items. These override personal and project-level items
# when conflicts arise. See schema.yaml for field definitions.
#
# ID scheme:
#   UV = Universal Value, UP = Universal Principle,
#   UH = Universal Heuristic, UR = Universal Rule
#   IDs are stable — never reuse a retired ID.
