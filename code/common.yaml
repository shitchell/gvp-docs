heuristics:
  - id: CH1
    name: Dependency adoption threshold
    statement: |
      If the useful portion of an external library is approximately 200 lines or fewer, write it yourself. Evaluate: what fraction of the library do you actually use? Does it fit your architecture? What is the bus factor of the maintainer? What is the burden of working around its limitations? If the answers favor writing it yourself, do so.
    tags:
      - code
      - simplicity
    maps_to:
      - personal:G1
      - personal:V1
  - id: CH2
    name: Deferral decision tree
    statement: |
      If a feature is needed for stability or correctness: implement now. If a feature is additive and its access patterns are unknown: add flex points (interfaces, config hooks) without implementing the feature. If a feature is speculative with no concrete use case: defer entirely with no flex points.
    tags:
      - code
      - simplicity
      - maintainability
    maps_to:
      - personal:G1
      - personal:V1
rules:
  - id: CR1
    name: Secrets out of source control
    statement: |
      API keys, credentials, tokens, and passwords are never committed to version control. Use gitignored config files with committed examples. Use environment variables or secret managers.
    tags:
      - code
      - security
    maps_to:
      - personal:G1
      - personal:V2
  - id: CR2
    name: No scaffolding without explicit verification
    statement: |
      If scaffolding or placeholder implementations are ever created, the implementing agent MUST have record of explicit, verbatim, quoted verification from the user that scaffolding is desired. No exceptions. LLMs tend to implement scaffolding where it is not wanted.
    tags:
      - code
      - ai
      - trust
    maps_to:
      - personal:G1
      - personal:V2
