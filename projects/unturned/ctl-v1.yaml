# Unturned-ctl v1 Implementation GVP
#
# Implementation-specific items for the current unturned-ctl codebase.
# These are tied to the current tech stack (Python 3.11+, stdlib only,
# parser registry pattern). If the implementation changes significantly,
# these items may be deprecated and replaced in a new child scope.

meta:
  name: ctl-v1
  inherits: projects/unturned
  scope: implementation
  defaults:
    origin:
      project: unturned-ctl
      date: 2026-02-22


design_choices:

  - id: D1
    name: Python 3.11+ stdlib only (until merge)
    rationale: >
      Keeps unturned-ctl dependency-free. Pydantic arrives with the
      unturned-data merge, not before.
    maps_to: [G3, V3]
    tags: [code]

  - id: D2
    name: Parser registry with BaseParser ABC
    rationale: >
      Self-contained parsers with priority-based auto-discovery.
      Matches unturned-data's TYPE_REGISTRY / PROPERTIES_REGISTRY
      pattern for merge compatibility.
    maps_to: [G1, G3, P1]
    tags: [code, extensibility]

  - id: D3
    name: serialize() as method on BaseParser
    rationale: >
      Co-locates format knowledge for maintainability. Pure inverse of
      parse() — no external dependencies, testable round-trip
      invariant.
    maps_to: [G2, P1, P5, V6]
    tags: [code, maintainability]

  - id: D4
    name: Separate editor layer (core/editors/)
    rationale: >
      Domain intelligence (name resolution, defaults, grid packing)
      separated from format I/O (parsers) and CLI orchestration
      (commands). Editors are the merge boundary — the only layer that
      touches the catalog.
    maps_to: [G2, G3, P5, V6]
    tags: [code, maintainability]

  - id: D5
    name: Generic Catalog[T] with ItemInfo bridge type
    rationale: >
      One generic lookup class parameterized by entry type. Scoped at
      construction, not subclassed. ItemInfo is a transient stdlib
      dataclass deleted on merge day when BundleEntry takes its place.
    maps_to: [G3, P1, V2]
    tags: [code, extensibility, maintainability]

  - id: D6
    name: Full-replace editing semantics
    rationale: >
      User sees full JSON in editor, what they save is what gets
      written. No hidden merge logic. Smart defaults (normalize) apply
      only to new/incomplete entries.
    maps_to: [G2, V1, V3]
    tags: [ux, transparency]

  - id: D7
    name: Editor fallback chain ($VISUAL -> $EDITOR -> editor -> vi -> nano)
    rationale: >
      Follows Unix conventions. Includes Debian update-alternatives.
      Zero configuration required on standard systems.
    maps_to: [V5, H4]
    tags: [cli, usability]

  - id: D8
    name: Opt-in backup delegating to existing system
    rationale: >
      --backup/--no-backup flags, configurable default, delegates to
      existing hardlink-based backup infrastructure.
    maps_to: [V4, H2]
    tags: [cli, composability]


implementation_rules:

  - id: IR1
    name: Round-trip invariant must hold
    statement: >
      For every parser that implements serialize(),
      serialize(parse(f)) must produce bytes identical to the original
      file for any valid input. This is tested for every parser with
      both synthetic and real server files.
    depends_on: [D3]
    maps_to: [G2, V7, P5]
    tags: [code, correctness]

  - id: IR2
    name: Parsers must not depend on external services
    statement: >
      parse() and serialize() must be pure functions of their input.
      No resolver, no catalog, no network access, no config. External
      dependencies belong in the editor layer.
    depends_on: [D3, D4]
    maps_to: [P5, V6]
    tags: [code, maintainability]

  - id: IR3
    name: Editor layer is the sole catalog consumer
    statement: >
      Only code in core/editors/ may import or use the Catalog. Parsers
      and CLI commands do not touch it directly. This ensures the merge
      boundary is clean — swapping the catalog backing only affects one
      layer.
    depends_on: [D4, D5]
    maps_to: [G3, P1, V6]
    tags: [code, maintainability]
