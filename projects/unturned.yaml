# Unturned Project GVP
#
# Project-level items for the unturned-ctl / unturned-data / eventual
# unified "unturned" project. Inherits from personal.yaml.
# See schema.yaml for field definitions and inheritance rules.
#
# These items should remain stable across implementations — even if
# we completely change frameworks or tools, the goals, constraints,
# and project-level values stay the same. Implementation-specific
# items (design choices, implementation rules, coding principles)
# live in child scopes (e.g., projects/unturned/ctl-v1.yaml).

meta:
  name: unturned
  inherits: personal
  scope: project
  defaults:
    origin:
      project: unturned
      date: 2026-02-22


goals:

  - id: G1
    name: Manage Unturned dedicated servers from the command line
    statement: >
      A unified CLI tool for server administration: start/stop, config
      management, player data inspection and editing, backup, and
      inventory operations.
    tags: [cli, systems]

  - id: G2
    name: Enable confident modification of player data
    statement: >
      Operators can inspect and edit binary player files (inventory,
      clothing, position) with full visibility into what they're
      changing and confidence that the round-trip is lossless.
    tags: [ux, transparency, correctness]

  - id: G3
    name: Unify unturned-data and unturned-ctl into a single tool
    statement: >
      Eventually merge the data export pipeline (unturned-data) and
      the server management tool (unturned-ctl) into one "unturned"
      CLI with shared models and infrastructure. The merge should be
      as effortless as possible.
    tags: [composability, maintainability]


milestones:

  - id: M1
    name: inspect command shipped
    progress: complete
    advances: [unturned:G1, unturned:G2]
    description: >
      Parser registry, 4 parsers (inventory, clothing, player position,
      text-dat), item resolver, and inspect CLI command. All tests
      passing.

  - id: M2
    name: edit command shipped
    progress: in-progress
    advances: [unturned:G1, unturned:G2, unturned:G3]
    description: >
      Round-trip binary editing via JSON. Serialization on parsers,
      editor layer with normalize/validate, generic Catalog[T], edit
      CLI command. Design approved, implementation plan written.

  - id: M3
    name: unturned-data merge
    progress: planned
    advances: [unturned:G3]
    description: >
      Merge unturned-data models and pipeline into unturned-ctl.
      Swap ItemInfo for BundleEntry. Delete bridge types. Unified CLI.


constraints:

  - id: CON1
    name: Binary formats are reverse-engineered
    impact: >
      Inventory.dat, Clothing.dat, and Player.dat formats come from
      decompiled C# (Unturned-Datamining). Specs may be incomplete.
      Round-trip tests against real server files are critical.
    tags: [correctness]

  - id: CON2
    name: Numeric IDs collide across categories
    impact: >
      Items, vehicles, and objects share the same numeric ID space.
      Item lookups must be scoped to the Items/ bundle subdirectory.
      GUIDs are globally unique and don't need scoping.
    tags: [code]

  - id: CON3
    name: Workshop mods have varying directory layouts
    impact: >
      Workshop content under Steam/content/304930/<mod_id>/ has no
      standard internal layout. Bundle scanning must use rglob to
      find Items/ subdirectories at any depth.
    tags: [code]

  - id: CON4
    name: GUIDs use .NET mixed-endian format
    impact: >
      Clothing.dat stores GUIDs as 16 bytes in .NET's mixed-endian
      byte order (bytes_le). Must use uuid.UUID(bytes_le=...) for
      parsing and .bytes_le for serialization.
    tags: [code, correctness]

  - id: CON5
    name: Item grid dimensions are external metadata
    impact: >
      Size_X and Size_Y for inventory grid packing are stored in
      each item's bundle .dat file, not in Inventory.dat itself.
      Auto-placement requires catalog access to look up dimensions.
    tags: [code]
