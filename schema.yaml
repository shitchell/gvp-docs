# GVP Schema
#
# Defines the structure of all GVP items. Used by the `gvp` utility
# for validation and by humans for reference.

# --- Provenance ---

provenance:
  origin:
    description: Where this item was first inferred.
    schema:
      project:
        type: string
        required: true
        description: Project name (e.g., "unturned-ctl")
      decisions:
        type: list[int]
        required: false
        description: Decision numbers from that project's PLANNING.md
      date:
        type: date
        required: true
        description: ISO date of the session (YYYY-MM-DD)
      evidence:
        type: string
        required: false
        description: Verbatim quotes or factual observations supporting the item
      note:
        type: string
        required: false
        description: Optional context about the inference

  updated_by:
    description: >
      Subsequent modifications. Same schema as origin with the addition
      of a rationale field.
    schema:
      project:
        type: string
        required: true
        description: Project name
      decisions:
        type: list[int]
        required: false
        description: Decision numbers from that project's PLANNING.md
      date:
        type: date
        required: true
        description: ISO date of the modification
      evidence:
        type: string
        required: false
        description: Verbatim quotes or factual observations
      rationale:
        type: string
        required: true
        description: What changed and why


# --- Universal and Personal GVP items (universal.yaml / personal.yaml) ---
#
# universal.yaml and personal.yaml share the same item schemas.
# The only differences:
#   - Universal IDs are prefixed with "U" (UV1, UP1, UH1, UR1)
#   - Personal IDs use standard prefixes (V1, P1, H1, R1)
#   - Universal items take priority over personal items in conflicts
#
# Priority order: universal > personal > project

personal_items:

  value:
    description: >
      Semantic descriptors that shape trade-offs. The thumb on the scale
      when two valid approaches exist.
    fields:
      id:
        type: string
        required: true
        description: "Stable identifier. Format: V<number> (e.g., V1)"
      name:
        type: string
        required: true
        description: Short, descriptive name
      statement:
        type: string
        required: true
        description: What this value means and how it shapes decisions
      tags:
        type: list[string]
        required: true
        description: Tags from tags.yaml (domain and/or concern)
      origin:
        type: list[provenance.origin]
        required: true
        description: Where this item was first inferred
      updated_by:
        type: list[provenance.updated_by]
        required: false
        description: Subsequent modifications

  principle:
    description: >
      Less fuzzy than a value, more flexible than a rule. States a
      preference that requires judgment to apply.
    fields:
      id:
        type: string
        required: true
        description: "Stable identifier. Format: P<number>"
      name:
        type: string
        required: true
        description: Short, descriptive name
      statement:
        type: string
        required: true
        description: The preference or bias being stated
      tags:
        type: list[string]
        required: true
        description: Tags from tags.yaml
      maps_to:
        type: list[string]
        required: true
        description: IDs of values this principle serves (e.g., [V1, V3])
      heuristics:
        type: list[string]
        required: false
        description: IDs of heuristics that operationalize this principle
      origin:
        type: list[provenance.origin]
        required: true
      updated_by:
        type: list[provenance.updated_by]
        required: false

  heuristic:
    description: >
      Well-defined if/then decision trees. Where a principle says
      "prefer X," a heuristic says "if A, then B; else C."
    fields:
      id:
        type: string
        required: true
        description: "Stable identifier. Format: H<number>"
      name:
        type: string
        required: true
        description: Short, descriptive name
      statement:
        type: string
        required: true
        description: The if/then decision procedure
      tags:
        type: list[string]
        required: true
        description: Tags from tags.yaml
      maps_to:
        type: list[string]
        required: true
        description: IDs of principles/values this heuristic operationalizes
      origin:
        type: list[provenance.origin]
        required: true
      updated_by:
        type: list[provenance.updated_by]
        required: false

  rule:
    description: >
      Hard stops. Binary, no exceptions. A rule is a principle that
      graduated to "never cross this line."
    fields:
      id:
        type: string
        required: true
        description: "Stable identifier. Format: R<number>"
      name:
        type: string
        required: true
        description: Short, descriptive name
      statement:
        type: string
        required: true
        description: The hard stop being defined
      tags:
        type: list[string]
        required: true
        description: Tags from tags.yaml
      maps_to:
        type: list[string]
        required: true
        description: IDs of values/principles this rule enforces
      origin:
        type: list[provenance.origin]
        required: true
      updated_by:
        type: list[provenance.updated_by]
        required: false


# --- Project-specific items (<project>.yaml) ---

project_items:

  goal:
    description: >
      Ideal states we're working toward. Project-shape-agnostic.
    fields:
      id:
        type: string
        required: true
        description: "Stable identifier. Format: G<number>"
      name:
        type: string
        required: true
      statement:
        type: string
        required: true

  milestone:
    description: >
      Concrete, achievable waypoints on the path to goals.
    fields:
      id:
        type: string
        required: true
        description: "Stable identifier. Format: M<number>"
      name:
        type: string
        required: true
      status:
        type: string
        required: true
        description: "One of: planned, in-progress, complete"
      advances:
        type: list[string]
        required: true
        description: Goal IDs this milestone advances
      description:
        type: string
        required: true

  design_choice:
    description: >
      Frameworks, infrastructure, architecture. Specific to an
      implementation. Changes when the implementation changes.
    fields:
      id:
        type: string
        required: true
        description: "Stable identifier. Format: D<number>"
      name:
        type: string
        required: true
      rationale:
        type: string
        required: true
      maps_to:
        type: list[string]
        required: true
        description: Goal + value/principle IDs this choice serves
      tags:
        type: list[string]
        required: true

  constraint:
    description: >
      Facts about the system we don't control. Descriptive, not
      prescriptive.
    fields:
      id:
        type: string
        required: true
        description: "Stable identifier. Format: CON<number>"
      name:
        type: string
        required: true
      impact:
        type: string
        required: true
        description: How this constraint affects design/implementation

  implementation_rule:
    description: >
      Hard stops contingent on design choices. If the design choice
      changes, the rule may not apply.
    fields:
      id:
        type: string
        required: true
        description: "Stable identifier. Format: IR<number>"
      name:
        type: string
        required: true
      statement:
        type: string
        required: true
      depends_on:
        type: list[string]
        required: true
        description: Design choice IDs this rule depends on
      maps_to:
        type: list[string]
        required: true
        description: Goal + value/principle IDs this rule enforces
      tags:
        type: list[string]
        required: true

  coding_principle:
    description: >
      Guidelines for writing code in a specific implementation.
      Change with the tech stack.
    fields:
      id:
        type: string
        required: true
        description: "Stable identifier. Format: C<number>"
      name:
        type: string
        required: true
      statement:
        type: string
        required: true
      maps_to:
        type: list[string]
        required: true
        description: Principle/design choice + value IDs
      tags:
        type: list[string]
        required: true


# --- Tags (tags.yaml) ---

tags:
  description: >
    Tag registry. Two flavors: domain tags (what area) and concern
    tags (what quality). Defined in tags.yaml to prevent drift.
  schema:
    domains:
      type: map[string, {description: string}]
    concerns:
      type: map[string, {description: string}]
